# Source registry (SPEC §4.13). Drafted in the Foundation PR; P2 finalised it on Kobol's reads of
# 2026-11-09 (the curl read of every URL and P2 session 1's `npm run sources:check`). MyJVN, the Anthropic
# dashboard, iThome, Focus Taiwan, NHK, the Google Threat Intelligence blog, Google's security blog, BSI and
# the CISA advisories moved to the paths that answer; TPEx and CISA's alerts joined; the MSRC blog (no feed)
# left. iThome's zone-less dates are Taipei time (date_zone). Google's security blog moved to
# blog.google/security (session 2, 2026-11-10: the feedburner feed stopped at 2026-04-23).
schema_version: 1
keywords:            # ranking boosts and filters for news items; any language; case-insensitive
  - zero-day
  - 0-day
  - actively exploited
  - exploited in the wild
  - known exploited
  - ransomware
  - data breach
  - breach
  - hack
  - hacked
  - cyberattack
  - cyber attack
  - vulnerability
  - vulnerabilities
  - CVE-
  - remote code execution
  - authentication bypass
  - supply chain
  - backdoor
  - malware
  - espionage
  - state-sponsored
  - APT
  - phishing
  - extortion
  - leak
  - critical infrastructure
  - patch
  - emergency directive
  - AI-found
  - AI agent
  - 資安
  - 駭客
  - 勒索
  - 漏洞
  - 網路攻擊
  - 資料外洩
  - 個資外洩
  - 惡意程式
  - 脆弱性
  - 不正アクセス
  - ランサムウェア
  - サイバー攻撃
  - 情報漏えい
  - ゼロデイ
  - マルウェア
