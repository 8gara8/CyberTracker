    fallback_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    language: en
    region: US
    coverage: [exploits]
    priority: 1
    fresh_days: 7
    must_match: false
    date_zone: null
  - id: cvelist
    name: CVE List V5 (CVEProject/cvelistV5)
